[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "routehunter"
version = "1.0.0"
description = "A system for the collection and distribution of reference information on chemical synthesis routes"
readme = "README.rst"
license = { text = "MIT" }
authors = [
    { name = "Dmitry Zankov" },
]
requires-python = ">=3.12"

dependencies = [
    "pandas>=2.0",
    "rdkit>=2023.9.1",
    "scikit-learn>=1.3",
    "huggingface_hub>=0.24",
]

[tool.setuptools]
packages = ["routehunter"]

[project.urls]
Homepage = "https://github.com/KagakuLab/RouteHunter"
Repository = "https://github.com/KagakuLab/RouteHunter"